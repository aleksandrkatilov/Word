name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore
        run: dotnet restore Pero.sln

      - name: Build
        run: dotnet build Pero.sln -c Release --no-restore

      - name: Core tests
        run: dotnet run --project tests/Pero.Core.Tests -c Release --no-build

      - name: Reference documents
        run: |
          pip install python-docx pillow
          python samples/make_samples.py samples/docx --perf

      - name: Inspect reference documents
        shell: pwsh
        run: |
          dotnet run --project tools/Pero.Probe -c Release --no-build -- inspect samples/docx
          # 3 = есть отклонённые файлы (ожидаемо для 9x-*.docx)
          if ($LASTEXITCODE -gt 3) { exit $LASTEXITCODE }
          exit 0

      - name: Publish app (win-x64, self-contained)
        run: dotnet publish src/Pero.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/Pero

      - uses: actions/upload-artifact@v4
        with:
          name: Pero-win-x64
          path: artifacts/Pero

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          } else { $iscc = (Get-Command iscc).Source }
          $iscc = if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" } else { (Get-Command iscc).Source }
          & $iscc /Q /DAppVersion=0.2.${{ github.run_number }} installer\pero.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem artifacts\Pero-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Pero-Setup
          path: artifacts/Pero-Setup-*.exe

      - name: Screen 1920x1080 (целевой стенд ТЗ)
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Lab — движок, лента, UI-прогон
        continue-on-error: true
        timeout-minutes: 30
        env:
          PERO_SYNCFUSION_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: dotnet run --project tools/Pero.Lab -c Release -- all samples/docx artifacts/Pero/Pero.exe ci-out

      - name: Lab — поиск зависания (варианты окна)
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        env:
          PERO_SYNCFUSION_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: |
          foreach ($v in @("plain","spell","ribbon","theme","ribbon-theme","ribbon-theme-spell","ribbon-theme-spell-direct")) {
            dotnet run --project tools/Pero.Lab -c Release --no-build -- hang samples/docx $v ci-out
          }

      - name: Results → ветка ci-results
        if: always()
        shell: bash
        run: |
          mkdir -p ci-out/pero-logs
          cp -r "$LOCALAPPDATA/Pero/Logs/." ci-out/pero-logs/ 2>/dev/null || true
          cd ci-out
          echo "run=${{ github.run_id }} sha=${{ github.sha }} date=$(date -u +%FT%TZ)" > RUN.txt
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "results ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
